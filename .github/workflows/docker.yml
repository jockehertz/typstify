name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  cargo-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Cargo binary
      run: cargo build --release

  docker-build:
    needs: cargo-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Cargo binary
      run: cargo build --release
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag typstify:1.0.0

  docker-push:
    if: github.event_name == 'push'
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login to Docker
      run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PAT }}
    - name: Build the Cargo binary
      run: cargo build --release
    - name: Build the Docker image to push
      run: docker build . --file Dockerfile --tag jockehertz/typstify:latest
    - name: Push to Docker Hub
      run: docker push jockehertz/typstify:latest
